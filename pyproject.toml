[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "On-call incident triage service with a propose-only Claude tool-use agent."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zeeshan Imdad" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=2.3,<3",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "BLE", "C4", "SIM", "RUF", "PT", "RET", "TID",
]
ignore = [
    "S101", # assert is fine in tests; package code does not rely on it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"evals/**" = ["S311"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/triage", "tests", "evals", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*", "scripts.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["triage"]
# SQLAlchemy asyncio runs ORM work inside greenlets; without this, coverage under-reports.
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
